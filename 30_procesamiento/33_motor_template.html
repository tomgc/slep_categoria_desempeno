<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<title>Motor de comparación — Categoría de Desempeño de los establecimientos</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230A3A5C'/%3E%3Crect x='8' y='15' width='4' height='9' rx='1' fill='%23FFF6E0'/%3E%3Crect x='14' y='10' width='4' height='14' rx='1' fill='%23FFF6E0'/%3E%3Crect x='20' y='6' width='4' height='18' rx='1' fill='%23C45A3E'/%3E%3C/svg%3E" />
<style>
/* ============================================================
   SLEP Costa Central — colores y tipografía (sin @font-face;
   los .otf gobCL/Museo Sans no están versionados, así que se
   usa el stack system como fallback).
   ============================================================ */

:root {
  /* Mark colors */
  --mark-red:    #EE2D49;
  --mark-pink:   #F8A0AE;
  --mark-yellow: #FFC92E;
  --mark-green:  #9BC93E;
  --mark-blue:   #2A8FD9;

  /* Brand palette */
  --plum:        #4A2746;
  --cream:       #FFF6E0;
  --ocean:       #0062A0;
  --slate:       #747474;
  --olive:       #75924E;
  --sand:        #BCA493;
  --coral:       #E88663;

  /* Neutrals derivados */
  --ink:         #1C1212;
  --ink-2:       #2E2230;
  --paper:       #FFFFFF;
  --cream-50:    #FFFBEF;
  --cream-200:   #F4E9CC;
  --line:        #E7DFC9;
  --line-strong: #C8BDA0;
  --plum-80:     #66394F;
  --plum-20:     #EEDCE5;
  --ocean-80:    #00558A;
  --ocean-20:    #D4E4F1;

  /* Semánticos */
  --fg-1: var(--ink);
  --fg-2: var(--ink-2);
  --fg-3: var(--slate);
  --fg-on-dark: var(--cream);
  --fg-on-plum: var(--cream);
  --fg-link: var(--ocean);
  --bg-1: var(--cream);
  --bg-2: var(--paper);
  --bg-3: var(--cream-50);
  --bg-inverse: var(--plum);
  --accent: var(--coral);
  --success: var(--olive);
  --info: var(--ocean);
  --warning: var(--mark-yellow);
  --danger: var(--mark-red);
  --border-1: var(--line);
  --border-2: var(--line-strong);
  --border-strong: var(--plum);

  /* Spacing */
  --space-0: 0;     --space-1: 4px;   --space-2: 8px;   --space-3: 12px;
  --space-4: 16px;  --space-5: 24px;  --space-6: 32px;  --space-7: 48px;
  --space-8: 64px;  --space-9: 96px;

  /* Radii */
  --radius-0: 0; --radius-1: 2px; --radius-2: 4px; --radius-3: 8px;
  --radius-full: 9999px;

  /* Elevation */
  --shadow-1: 0 1px 0 rgba(28, 18, 18, 0.05);
  --shadow-2: 0 2px 8px rgba(74, 39, 70, 0.08);
  --shadow-3: 0 8px 24px rgba(74, 39, 70, 0.12);

  /* Type families — fallback al stack system. Cuando se versionen los
     .otf de gobCL/Museo Sans, agregar @font-face antes y usarlos arriba. */
  /* Familias: sans unificada (display y body eran idénticas) + mono.
     --font-display y --font-body se conservan como alias de --font-sans
     para no romper referencias existentes. */
  --font-sans:    system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --font-display: var(--font-sans);
  --font-body:    var(--font-sans);
  --font-mono:    ui-monospace, "SF Mono", "Menlo", monospace;

  /* Escala tipográfica estandarizada (8 pasos, sin medios píxeles).
     --fs-xs (11) es el piso para texto en minúsculas; --fs-overline (10)
     se reserva a etiquetas MAYÚSCULAS con tracking. */
  --fs-display: 30px;
  --fs-h1: 24px;
  --fs-h2: 18px;
  --fs-lg: 15px;
  --fs-base: 13px;
  --fs-sm: 12px;
  --fs-xs: 11px;
  --fs-overline: 10px;

  /* Pesos estandarizados (4). */
  --fw-regular: 400;
  --fw-medium: 600;
  --fw-bold: 700;
  --fw-heavy: 800;

  --lh-tight: 1.05;
  --lh-snug: 1.2;
  --lh-normal: 1.5;
  --lh-loose: 1.65;

  --tracking-tight: -0.01em;
  --tracking-normal: 0;
  --tracking-wide: 0.06em;
  --tracking-overline: 0.12em;
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  background: var(--bg-1);
  color: var(--fg-1);
  font-family: var(--font-body);
  font-weight: var(--fw-regular);
  font-size: var(--fs-lg);
  line-height: var(--lh-normal);
  -webkit-font-smoothing: antialiased;
}
::selection { background: var(--mark-yellow); color: var(--ink); }

/* ============================================================
   App layout
   ============================================================ */
.app { min-height: 100vh; display: flex; flex-direction: column; max-width: 1320px; margin: 0 auto; }
.app.is-comfy   { font-size: var(--fs-lg); }

/* Header */
.app-header {
  background: #0A3A5C;
  color: var(--fg-on-plum);
  padding: 34px 40px 30px;
}
.app-header-inner {
  display: flex; align-items: flex-start; justify-content: space-between;
  gap: 40px;
}
.app-header-left { min-width: 0; max-width: none; }
.app-header-right { display: flex; align-items: center; gap: 8px; }
.brand-lockup { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
.brand-eyebrow-row { display: flex; align-items: center; gap: 9px; margin-bottom: 16px; }
.brand-eyebrow {
  font-family: var(--font-display);
  font-weight: var(--fw-bold);
  font-size: var(--fs-xs);
  letter-spacing: 0.02em;
  color: var(--cream);
  opacity: 0.9;
}
.brand-eyebrow-muted { opacity: 0.55; font-weight: var(--fw-medium); }
.brand-divider { color: var(--cream); opacity: 0.35; font-size: var(--fs-xs); }
.app-title {
  font-family: var(--font-display);
  font-weight: var(--fw-heavy);
  font-size: var(--fs-display);
  letter-spacing: -0.01em;
  color: var(--cream);
  line-height: 1.06;
  margin: 0 0 9px 0;
}
.app-title-sub { font-weight: var(--fw-regular); font-size: var(--fs-h1); color: var(--cream); opacity: 0.7; letter-spacing: 0; }
.app-subtitle {
  font-family: var(--font-body);
  color: rgba(255,246,224,0.62);
  margin: 0; font-size: var(--fs-sm); line-height: 1.5;
  font-weight: var(--fw-medium); letter-spacing: 0.01em;
}
.app-objective {
  font-family: var(--font-body);
  color: rgba(255,246,224,0.82);
  margin: 18px 0 0 0; font-size: var(--fs-base); line-height: 1.62;
  padding-top: 18px;
  border-top: 1px solid rgba(255,246,224,0.15);
}
.app-objective strong { font-weight: var(--fw-bold); color: var(--cream); }
.app-objective-note {
  display: block; margin-top: 11px;
  font-size: var(--fs-sm); line-height: 1.55;
  color: rgba(255,246,224,0.6); max-width: 720px;
}
.app-objective-note strong { font-weight: var(--fw-bold); color: rgba(255,246,224,0.9); }

/* Main */
.app-main { flex: 1; max-width: 1600px; margin: 0 auto; width: 100%; }

/* Controles */
.controls-bar {
  display: flex; align-items: center; gap: 28px;
  padding: 18px 40px;
  background: var(--paper);
  border-top: 4px solid var(--coral);
  border-bottom: 1px solid var(--border-1);
  flex-wrap: wrap;
  position: sticky; top: 0; z-index: 50;
}
.control-group { display: flex; align-items: center; gap: 12px; }
.control-label {
  font-family: var(--font-display);
  font-weight: var(--fw-bold);
  font-size: var(--fs-xs);
  letter-spacing: var(--tracking-overline);
  color: var(--fg-3);
}
.segmented {
  display: inline-flex;
  background: var(--cream-200);
  border: 1px solid var(--border-1);
  border-radius: var(--radius-2);
  padding: 2px;
}
.segmented-btn {
  background: transparent; border: 0;
  padding: 6px 14px;
  font-family: var(--font-body);
  font-weight: var(--fw-medium);
  font-size: var(--fs-base);
  color: var(--fg-2);
  border-radius: var(--radius-1);
  cursor: pointer;
  transition: background 120ms ease, color 120ms ease;
}
.segmented-btn:hover { color: var(--fg-1); }
.segmented-btn.is-active {
  background: var(--paper);
  color: var(--plum);
  font-weight: var(--fw-bold);
  box-shadow: var(--shadow-1);
}
.select, .input {
  font-family: var(--font-body);
  font-weight: var(--fw-medium);
  font-size: var(--fs-base);
  color: var(--fg-1);
  background: var(--paper);
  border: 1px solid var(--border-2);
  border-radius: var(--radius-2);
  padding: 6px 28px 6px 10px;
  appearance: none;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23747474' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><polyline points='6 9 12 15 18 9'/></svg>");
  background-repeat: no-repeat;
  background-position: right 8px center;
  background-size: 14px 14px;
  cursor: pointer;
  min-width: 140px;
}
.select:focus, .input:focus {
  outline: 2px solid var(--ocean);
  outline-offset: 1px;
  border-color: var(--ocean);
}
.input {
  background-image: none; padding-right: 10px;
  cursor: text; min-width: 0; width: 100%;
}
.controls-spacer { flex: 1; }
.loading-pill {
  display: inline-flex; align-items: center; gap: 8px;
  padding: 4px 12px;
  background: var(--ocean-20); color: var(--ocean-80);
  border-radius: var(--radius-full);
  font-size: var(--fs-sm); font-weight: var(--fw-medium);
}
.loading-dot {
  width: 6px; height: 6px; border-radius: 999px;
  background: var(--ocean);
  animation: pulse 1.2s ease-in-out infinite;
}
@keyframes pulse {
  0%, 100% { opacity: 0.3; transform: scale(0.8); }
  50% { opacity: 1; transform: scale(1.3); }
}

/* Entities */
.entities-bar {
  padding: 20px 40px 22px;
  background: var(--bg-3);
  border-bottom: 1px solid var(--border-1);
}
.entities-head {
  display: flex; align-items: center; gap: 12px;
  margin-bottom: 12px;
}
.entities-reset { align-self: center; color: var(--fg-3); flex: none; }
.entities-reset:hover { color: var(--fg-1); }
.section-eyebrow {
  font-family: var(--font-display);
  font-weight: var(--fw-bold);
  font-size: var(--fs-xs);
  letter-spacing: var(--tracking-overline);
  color: var(--fg-3);
  margin: 0;
}
.entities-count { font-size: var(--fs-sm); color: var(--fg-3); font-weight: var(--fw-medium); }
.entities-list { display: flex; flex-wrap: wrap; gap: 8px; align-items: stretch; }
.entity-chip {
  display: inline-flex; align-items: flex-start; gap: 8px;
  padding: 6px 8px 6px 10px;
  background: var(--paper);
  border: 1px solid var(--border-2);
  border-radius: var(--radius-2);
  transition: border-color 120ms ease;
  max-width: 340px; flex: 0 1 auto;
}
.entity-chip:hover { border-color: var(--plum); }
.entity-swatch { width: 12px; height: 12px; border-radius: 2px; flex-shrink: 0; }
.entity-text { display: flex; flex-direction: column; line-height: 1.1; }
.entity-name {
  font-family: var(--font-body);
  font-weight: var(--fw-bold); font-size: var(--fs-base); color: var(--fg-1);
}
.entity-meta { font-size: var(--fs-xs); color: var(--fg-3); margin-top: 2px; font-weight: var(--fw-medium); }
.entity-btn {
  background: transparent; border: 0;
  padding: 4px; color: var(--fg-3); cursor: pointer;
  display: inline-flex; align-items: center; justify-content: center;
  border-radius: var(--radius-1);
}
.entity-btn:hover { background: var(--cream-200); color: var(--fg-1); }
.entity-btn-remove:hover { background: #fce7e7; color: var(--mark-red); }
.entity-btn .icon { width: 14px; height: 14px; }
.entities-actions {
  display: inline-flex; align-items: center; gap: 8px; margin-left: 4px;
}

/* Buttons */
.btn {
  display: inline-flex; align-items: center; gap: 6px;
  border: 1px solid transparent;
  padding: 7px 14px;
  border-radius: var(--radius-2);
  font-family: var(--font-body);
  font-weight: var(--fw-medium); font-size: var(--fs-base);
  cursor: pointer;
  transition: background 120ms ease, color 120ms ease, border-color 120ms ease, transform 80ms ease;
  text-decoration: none;
}
.btn:active { transform: translateY(1px); }
.btn .icon { width: 14px; height: 14px; }
.btn-small { padding: 5px 10px; font-size: var(--fs-sm); }
.btn-icon-only { padding: 6px; }
.btn-icon-only .icon { width: 16px; height: 16px; }
.btn-toggle { color: var(--fg-2); }
.btn-toggle.is-active {
  background: var(--ocean); color: var(--cream); border-color: var(--ocean);
}
.btn-toggle.is-active:hover { background: var(--ocean-80); border-color: var(--ocean-80); }
.btn-primary { background: var(--ocean); color: var(--cream); border-color: var(--ocean); }
.btn-primary:hover { background: var(--ocean-80); border-color: var(--ocean-80); }
.btn-ghost { background: transparent; color: var(--fg-1); border-color: var(--border-2); }
.btn-ghost:hover { background: var(--cream-200); border-color: var(--plum); }
.app-header-right .btn-ghost {
  background: rgba(255,246,224,0.06);
  color: var(--cream);
  border-color: rgba(255,246,224,0.2);
}
.app-header-right .btn-ghost:hover {
  background: rgba(255,246,224,0.12);
  border-color: rgba(255,246,224,0.4);
}
.icon-btn {
  background: transparent; border: 0;
  padding: 6px; cursor: pointer;
  color: var(--fg-2); border-radius: var(--radius-1);
  display: inline-flex; align-items: center; justify-content: center;
}
.icon-btn:hover { background: var(--cream-200); color: var(--fg-1); }
.icon-btn .icon { width: 18px; height: 18px; }
.icon { display: inline-block; vertical-align: middle; }

/* Results */
.results-section { padding: 28px 40px 8px; }
.empty-board {
  margin: 28px 40px; padding: 56px 32px;
  display: flex; flex-direction: column; align-items: center; text-align: center;
  gap: 10px;
  border: 1px dashed var(--border-2); border-radius: var(--radius-2);
  background: var(--cream-200);
}
.empty-board-text { font-size: var(--fs-lg); color: var(--fg-2); margin: 0; max-width: 520px; line-height: 1.5; }
.results-head {
  display: flex; flex-direction: column; align-items: stretch;
  gap: 14px; margin-bottom: 18px;
}
.results-head-top { display: flex; flex-direction: column; gap: 2px; }
/* Fila única bajo el título: controles a la izquierda, leyenda a la
   derecha (mockup). En pantallas angostas envuelve sin romperse. */
.results-head-controls {
  display: flex; align-items: center; justify-content: flex-start;
  gap: 16px 24px; flex-wrap: wrap;
}
.section-actions {
  display: flex; align-items: center; gap: 14px;
  flex-wrap: wrap; justify-content: flex-start;
}
/* La cabecera de la tabla conserva el layout horizontal (título a la
   izquierda, controles a la derecha). */
.table-head { justify-content: space-between; }
.table-head .section-actions { justify-content: flex-end; }
.icon-export {
  display: inline-flex; align-items: center; gap: 0;
  height: 32px; padding: 0 8px;
  background: transparent;
  border: 1px solid var(--border-2);
  border-radius: var(--radius-2);
  color: var(--fg-2); cursor: pointer;
  font-family: var(--font-body);
  font-weight: var(--fw-medium); font-size: var(--fs-base);
  overflow: hidden; max-width: 36px; white-space: nowrap;
  transition: max-width 240ms ease, background 120ms ease, color 120ms ease, border-color 120ms ease, gap 240ms ease;
}
.icon-export:hover, .icon-export:focus-visible {
  max-width: 220px; gap: 8px;
  background: var(--paper); border-color: #0A3A5C; color: #0A3A5C;
}
.icon-export .icon { width: 16px; height: 16px; flex-shrink: 0; }
.icon-export-label {
  opacity: 0; transform: translateX(-4px);
  transition: opacity 200ms ease 80ms, transform 200ms ease 80ms;
}
.icon-export:hover .icon-export-label,
.icon-export:focus-visible .icon-export-label {
  opacity: 1; transform: translateX(0);
}

.chart-hints {
  display: flex; flex-wrap: wrap; align-items: center;
  gap: 14px; font-size: var(--fs-sm);
}
.hint-item { display: inline-flex; align-items: center; gap: 6px; color: var(--fg-1); }
.hint-muted { color: var(--fg-3); font-size: var(--fs-xs); }
.hint-box {
  display: inline-block; width: 14px; height: 12px;
  border: 1px solid rgba(0,0,0,0.12); border-radius: 1px;
}
.hint-low-n {
  display: inline-block; width: 14px; height: 12px;
  background: #0A3A5C; opacity: 0.45; border-radius: 1px;
}
.hint-asterisk {
  display: inline-flex; align-items: center;
  font-weight: var(--fw-heavy); color: var(--ocean); font-size: var(--fs-lg);
  line-height: 0.6; width: 14px; justify-content: center;
}

.supergrid { display: grid; gap: 10px 12px; align-items: stretch; }
.supergrid-entity-head {
  display: flex; flex-direction: column;
  gap: 4px; padding: 4px 4px 6px;
  border-bottom: 2px solid var(--border-strong);
}
.supergrid-entity-head .entity-swatch { width: 16px; height: 16px; border-radius: 2px; }
.sg-ent-name {
  font-family: var(--font-display);
  font-weight: var(--fw-heavy); font-size: var(--fs-h2);
  color: var(--fg-1);
  letter-spacing: -0.005em; line-height: 1.1;
}
.sg-ent-meta { font-size: var(--fs-xs); color: var(--fg-3); font-weight: var(--fw-medium); }
.supergrid-gse-label {
  display: flex; flex-direction: column;
  justify-content: center;
  padding: 6px 6px 6px 0;
  border-right: 1px solid var(--border-1);
}
.sg-gse-eyebrow {
  font-family: var(--font-display);
  font-weight: var(--fw-bold); font-size: var(--fs-overline);
  letter-spacing: var(--tracking-overline);
  color: var(--fg-3);
}
.sg-gse-name {
  font-family: var(--font-display);
  font-weight: var(--fw-heavy); font-size: var(--fs-h2);
  color: #0A3A5C;
  letter-spacing: -0.005em; line-height: 1.1; margin-top: 2px;
}

.chart-cell {
  background: var(--paper);
  border: 1px solid var(--border-1);
  /* Un estilo inline sobrescribe el borde completo con el color de la
     entidad (1px), rodeando la ficha para identificar la columna. */
  border-radius: var(--radius-3);
  padding: 10px 10px 6px;
  box-shadow: var(--shadow-1);
  display: flex; flex-direction: column;
  gap: 4px; min-width: 0;
}
.chart-cell-head { display: flex; align-items: baseline; gap: 5px; margin-bottom: 2px; }
.chart-cell-eyebrow {
  font-family: var(--font-display);
  font-weight: var(--fw-bold); font-size: var(--fs-overline);
  letter-spacing: var(--tracking-overline);
  color: var(--fg-3);
}
.chart-cell-title {
  font-family: var(--font-display);
  font-weight: var(--fw-heavy); font-size: var(--fs-base);
  letter-spacing: -0.005em;
  color: #0A3A5C;
}
.sub-section { display: flex; flex-direction: column; gap: 0; min-width: 0; }
.sub-section-bars { padding-top: 6px; margin-top: 2px; border-top: 1px dashed var(--border-1); }
.sub-eyebrow {
  font-family: var(--font-display);
  font-weight: var(--fw-bold); font-size: var(--fs-overline);
  letter-spacing: var(--tracking-overline);
  color: var(--fg-3);
  padding-left: 2px; margin-bottom: 2px;
}
.sparkline-svg, .bars-svg, .chart-svg { width: 100%; height: auto; display: block; overflow: visible; }
.results-title {
  font-family: var(--font-display);
  font-weight: var(--fw-heavy); font-size: var(--fs-h1);
  letter-spacing: -0.005em;
  color: var(--fg-1);
  margin: 4px 0 0 0; line-height: 1.2;
}
.results-title-year { color: var(--ocean); }

/* Tooltip */
.tooltip {
  position: absolute; pointer-events: none; z-index: 9999;
  background: var(--paper); color: var(--fg-1);
  border: 1px solid var(--border-2);
  border-radius: var(--radius-2);
  box-shadow: var(--shadow-3);
  padding: 10px 12px;
  font-size: var(--fs-sm);
  min-width: 200px; max-width: 280px;
}
.tooltip.is-pinned {
  pointer-events: auto;
  border-color: var(--ocean);
  box-shadow: var(--shadow-3), 0 0 0 2px var(--ocean-20);
}
.tt-row { display: flex; align-items: center; gap: 6px; }
.tt-head { margin-bottom: 4px; }
.tt-swatch { width: 10px; height: 10px; border-radius: 2px; flex-shrink: 0; }
.tt-ent {
  font-family: var(--font-display);
  font-weight: var(--fw-heavy); font-size: var(--fs-sm);
  letter-spacing: 0.01em; color: var(--plum);
}
.tt-gse { font-size: var(--fs-xs); color: var(--fg-3); margin-bottom: 6px; }
.tt-pct {
  font-family: var(--font-display);
  font-weight: var(--fw-heavy); font-size: var(--fs-h2);
  color: var(--ink); line-height: 1;
  letter-spacing: -0.01em; margin-bottom: 6px;
}
.tt-segments {
  display: flex; flex-direction: column; gap: 4px;
  padding: 6px 0; margin-bottom: 4px;
  border-bottom: 1px solid var(--border-1);
}
.tt-seg {
  display: grid; grid-template-columns: 10px 1fr auto;
  gap: 6px; align-items: center; font-size: var(--fs-sm);
}
.tt-seg-sw { width: 10px; height: 10px; border-radius: 2px; }
.tt-seg-lbl { color: var(--fg-2); }
.tt-seg-val {
  font-family: var(--font-display);
  font-weight: var(--fw-heavy); font-size: var(--fs-base);
  color: var(--ink); letter-spacing: -0.01em;
  font-variant-numeric: tabular-nums;
}
.tt-meta {
  display: flex; flex-direction: column; gap: 2px;
  font-size: var(--fs-xs); color: var(--fg-2);
  padding-top: 6px; border-top: 1px solid var(--border-1);
}
.tt-meta b { font-weight: var(--fw-bold); color: var(--ink); }
.tt-warn {
  margin-top: 6px; padding: 4px 6px;
  background: var(--cream-200); color: var(--ink-2);
  font-size: var(--fs-xs);
  border-radius: var(--radius-1);
  border-left: 2px solid var(--coral);
}
.tt-estab-link {
  display: block; width: 100%;
  margin-top: 8px; padding: 5px 8px;
  background: transparent;
  border: 1px solid var(--border-2);
  border-radius: var(--radius-1);
  color: var(--ocean); font-size: var(--fs-xs); font-weight: var(--fw-medium);
  text-align: left; cursor: pointer;
  font-family: var(--font-body);
  transition: background 100ms ease, border-color 100ms ease;
}
.tt-estab-link:hover { background: var(--ocean-20); border-color: var(--ocean); }

/* Tabla */
.table-section { padding: 28px 40px; }
.table-head {
  display: flex; align-items: baseline; gap: 16px;
  margin-bottom: 6px; flex-wrap: wrap;
}
.table-head-titles { display: flex; flex-direction: column; gap: 2px; }
.table-title {
  font-family: var(--font-display);
  font-weight: var(--fw-heavy); font-size: var(--fs-h1);
  letter-spacing: -0.005em;
  color: var(--fg-1); margin: 0; line-height: 1.2;
}
.table-meta { margin-left: auto; display: flex; align-items: center; gap: 12px; }
.table-meta-item { font-size: var(--fs-sm); color: var(--fg-3); }
.table-wrap {
  background: var(--paper);
  border: 1px solid var(--border-1);
  border-radius: var(--radius-3);
  overflow: auto;
  box-shadow: var(--shadow-1);
  position: relative;
}
.data-table {
  border-collapse: collapse; width: 100%;
  font-size: var(--fs-base); min-width: 1000px;
}
.data-table thead th {
  position: sticky; top: 0; z-index: 3;
  background: var(--cream-200);
  color: var(--fg-1);
  font-family: var(--font-display);
  font-weight: var(--fw-bold); font-size: var(--fs-xs);
  letter-spacing: var(--tracking-overline);
  text-align: right;
  padding: 10px 12px;
  border-bottom: 2px solid var(--border-2);
  white-space: nowrap;
}
.data-table thead th.th-ent,
.data-table thead th.th-gse { text-align: left; }
.data-table thead th.th-ent { left: 0; z-index: 4; min-width: 200px; }
.data-table thead th.th-gse { left: 200px; z-index: 4; min-width: 110px; }
.data-table thead th.th-prelim { color: var(--ocean-80); }
.prelim-mark { color: var(--ocean); font-weight: var(--fw-heavy); }
.badge-traspaso {
  display: inline-block;
  margin-left: 6px;
  padding: 1px 6px;
  border-radius: 8px;
  background: rgba(0,98,160,0.10);
  color: var(--ocean);
  font-size: var(--fs-xs);
  font-weight: var(--fw-heavy);

  letter-spacing: 0.02em;
  vertical-align: middle;
  white-space: nowrap;
}
.slep-disclaimer {
  grid-column: 1 / -1;
  display: flex; gap: 8px; align-items: flex-start;
  padding: 10px 12px;
  border: 1px solid rgba(0,98,160,0.25);
  border-radius: var(--radius-2);
  background: rgba(0,98,160,0.06);
  color: var(--fg-2);
  font-size: var(--fs-sm); line-height: 1.45;
}
.slep-disclaimer .icon { width: 16px; height: 16px; color: var(--ocean); flex: none; margin-top: 1px; }
.slep-disclaimer.is-compact { font-size: var(--fs-xs); padding: 8px 10px; }
.entity-slep-note {
  display: inline-flex; gap: 4px; align-items: flex-start;
  margin-top: 3px;
  font-size: var(--fs-xs); line-height: 1.3; font-weight: var(--fw-medium);
  color: var(--ocean);
  white-space: normal;
}
.entity-slep-note .icon { width: 12px; height: 12px; flex: none; margin-top: 1px; }
.data-table tbody td {
  padding: 8px 12px;
  border-bottom: 1px solid var(--border-1);
  text-align: right;
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}
.data-table tbody td.td-ent,
.data-table tbody td.td-gse { text-align: left; }
.data-table tbody td.td-ent {
  position: sticky; left: 0; z-index: 2;
  background: var(--paper);
  min-width: 200px;
  border-right: 1px solid var(--border-1);
}
.data-table tbody td.td-gse {
  position: sticky; left: 200px; z-index: 2;
  background: var(--paper); min-width: 110px;
  border-right: 1px solid var(--border-1);
  color: var(--fg-2);
}
.data-table tbody tr.row-ent-start td { border-top: 2px solid var(--border-2); }
.data-table tbody tr.row-ent-start:first-child td { border-top: 0; }
.data-table tbody td.td-cell { position: relative; }
.data-table tbody tr:hover td:not(.td-ent):not(.td-gse) {
  outline: 1px solid var(--plum); outline-offset: -1px;
}
.ent-cell { display: inline-flex; align-items: center; gap: 8px; }
.ent-name { font-weight: var(--fw-bold); color: var(--fg-1); }
.td-pct { font-family: var(--font-body); font-weight: var(--fw-bold); color: var(--fg-1); }
.td-n { font-size: var(--fs-xs); color: var(--fg-3); margin-left: 2px; }
.td-empty { color: var(--border-2); }
.td-prelim { background: rgba(0,98,160,0.04); }
.td-prelim .td-pct { color: var(--ocean-80); }
.td-prelim .td-pct::after { content: " *"; color: var(--ocean); font-weight: var(--fw-heavy); }
.td-alert-dot {
  display: inline-block; margin-left: 6px;
  font-size: var(--fs-xs); color: var(--mark-red);
  font-weight: var(--fw-heavy); vertical-align: middle;
}
.td-alert .td-pct { color: #8B1A1A; }

.heat-legend {
  display: grid;
  grid-template-columns: minmax(280px, 1.2fr) minmax(320px, 1.6fr);
  gap: 24px; align-items: center;
  margin: 6px 0 16px;
  padding: 16px 20px;
  background: var(--paper);
  border: 1px solid var(--border-1);
  border-left: 3px solid var(--coral);
  border-radius: var(--radius-2);
}
@media (max-width: 900px) { .heat-legend { grid-template-columns: 1fr; } }
.heat-legend-text { min-width: 0; }
.heat-legend-title {
  display: block;
  font-family: var(--font-display);
  font-weight: var(--fw-heavy); font-size: var(--fs-base);
  color: var(--fg-1); margin-bottom: 4px;
}
.heat-legend-text p { margin: 0; font-size: var(--fs-sm); color: var(--fg-2); line-height: 1.5; max-width: 56ch; }
.heat-legend-scale { display: flex; flex-direction: column; gap: 6px; }
.heat-scale-bar {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  align-items: flex-end; gap: 6px;
  font-size: var(--fs-xs); color: var(--fg-2);
}
.heat-tick { display: flex; flex-direction: column; gap: 1px; }
.heat-tick b { font-size: var(--fs-sm); font-weight: var(--fw-bold); }
.heat-tick small { font-size: var(--fs-xs); color: var(--fg-3); line-height: 1.3; }
.heat-tick-left { text-align: left; }
.heat-tick-left b { color: #8B1A1A; }
.heat-tick-mid { text-align: center; }
.heat-tick-mid b { color: var(--fg-2); }
.heat-tick-right { text-align: right; }
.heat-tick-right b { color: var(--ocean-80); }
.heat-ramp {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  height: 10px; border-radius: 2px;
  overflow: hidden; border: 1px solid var(--border-1);
}
.heat-ramp-bar { width: 100%; height: 100%; }
.heat-ramp-coral { background: linear-gradient(to right, rgba(232,134,99,0.55), rgba(232,134,99,0)); }
.heat-ramp-mid { background: var(--cream-50); }
.heat-ramp-ocean { background: linear-gradient(to right, rgba(10,58,92,0), rgba(10,58,92,0.55)); }

/* Footer */
.app-footer { padding: 4px 40px 48px; margin-top: 0; }
.notes-toggle {
  display: inline-flex; align-items: center; gap: 10px;
  background: transparent;
  border: 1px solid var(--border-2);
  border-radius: var(--radius-2);
  padding: 10px 14px;
  font-family: var(--font-display);
  font-weight: var(--fw-bold); font-size: var(--fs-sm);
  letter-spacing: var(--tracking-overline);
  color: var(--fg-1); cursor: pointer;
}
.notes-toggle:hover { background: var(--cream-200); border-color: var(--plum); }
.notes-toggle .icon { width: 16px; height: 16px; }
.notes-toggle .chev { margin-left: 4px; transition: transform 200ms ease; }
.notes-toggle .chev .icon { width: 14px; height: 14px; }
.notes-toggle.is-open .chev { transform: rotate(180deg); }
.notes-body {
  margin-top: 14px;
  background: var(--paper);
  border: 1px solid var(--border-1);
  border-radius: var(--radius-3);
  padding: 28px; box-shadow: var(--shadow-1);
}
.notes-grid { columns: 3 280px; column-gap: 36px; }
.notes-grid .note { break-inside: avoid; margin-bottom: 24px; display: inline-block; width: 100%; }
.note-stack { display: contents; }
@media (max-width: 900px) { .notes-grid { columns: 1; } }
.note h4 {
  font-family: var(--font-display);
  font-weight: var(--fw-heavy); font-size: var(--fs-base);
  letter-spacing: var(--tracking-overline);
  color: var(--plum); margin: 0 0 8px;
}
.note p { font-size: var(--fs-base); color: var(--fg-2); line-height: 1.55; margin: 0 0 8px; max-width: 60ch; }
.note p b { color: var(--ink); font-weight: var(--fw-bold); }
.formula {
  display: inline-block;
  background: var(--cream-200);
  padding: 4px 8px;
  font-family: var(--font-mono);
  font-size: var(--fs-sm); margin: 4px 0 8px;
  border-radius: var(--radius-1);
}
.notes-sources {
  margin-top: 20px; padding-top: 16px;
  border-top: 1px solid var(--border-1);
  font-size: var(--fs-sm); color: var(--fg-3);
}

/* Modal */
.modal-backdrop {
  position: fixed; inset: 0;
  background: rgba(28, 18, 18, 0.45);
  display: flex; align-items: center; justify-content: center;
  z-index: 10000; padding: 20px;
  animation: fadeIn 140ms ease-out;
}
.modal {
  background: var(--paper);
  border-radius: var(--radius-3);
  box-shadow: var(--shadow-3);
  width: 100%; max-width: 540px; max-height: 88vh;
  display: flex; flex-direction: column; overflow: hidden;
  animation: lift 180ms cubic-bezier(.2,.7,.2,1);
}
@keyframes fadeIn { from { opacity: 0 } to { opacity: 1 } }
@keyframes lift { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
.modal-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 18px 22px;
  border-bottom: 1px solid var(--border-1);
}
.modal-title {
  font-family: var(--font-display);
  font-weight: var(--fw-heavy); font-size: var(--fs-h2);
  letter-spacing: -0.005em; margin: 0; color: var(--plum);
}
.modal-tabs {
  display: flex;
  border-bottom: 1px solid var(--border-1);
  padding: 0 22px;
}
.modal-tab {
  background: transparent; border: 0;
  padding: 12px 0; margin-right: 24px;
  font-family: var(--font-body);
  font-weight: var(--fw-medium); font-size: var(--fs-base);
  color: var(--fg-3); cursor: pointer;
  border-bottom: 2px solid transparent;
  margin-bottom: -1px;
}
.modal-tab:hover { color: var(--fg-1); }
.modal-tab.is-active {
  color: var(--plum); font-weight: var(--fw-bold);
  border-bottom-color: var(--ocean);
}
.modal-body { padding: 22px; overflow-y: auto; flex: 1; }
.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.field { display: flex; flex-direction: column; gap: 6px; }
.field-full { grid-column: 1 / -1; }
.field-label {
  font-family: var(--font-display);
  font-weight: var(--fw-bold); font-size: var(--fs-xs);
  letter-spacing: var(--tracking-overline);
  color: var(--fg-3);
  display: flex; justify-content: space-between;
}
.field-hint { font-weight: var(--fw-medium); font-size: var(--fs-xs); color: var(--ocean); }
.input-search { background-image: none; margin-bottom: 8px; }
.color-preview {
  display: flex; align-items: center; gap: 10px;
  padding: 8px 10px;
  background: var(--cream-50);
  border: 1px solid var(--border-1);
  border-radius: var(--radius-2);
}
.color-preview .entity-swatch { width: 16px; height: 16px; }
.color-note { font-size: var(--fs-sm); color: var(--fg-3); }
.comuna-checklist {
  border: 1px solid var(--border-1);
  border-radius: var(--radius-2);
  max-height: 220px; overflow-y: auto;
  background: var(--cream-50);
}
.check-row {
  display: flex; align-items: center; gap: 10px;
  padding: 6px 10px;
  cursor: pointer;
  border-bottom: 1px solid var(--border-1);
}
.check-row:last-child { border-bottom: 0; }
.check-row:hover { background: var(--cream-200); }
.check-row input[type="checkbox"] { accent-color: var(--ocean); }
.check-row.is-disabled { opacity: 0.45; }
.check-row.is-disabled:hover { background: transparent; }
.multiselect-hint { display: block; font-size: var(--fs-xs); color: var(--fg-3); margin: 2px 0 4px; }
.check-name { font-size: var(--fs-base); font-weight: var(--fw-medium); color: var(--fg-1); flex: 1; }
.check-region { font-size: var(--fs-xs); color: var(--fg-3); }
.check-box {
  display: inline-flex; align-items: center; justify-content: center;
  width: 18px; height: 18px; flex-shrink: 0;
  border: 1.5px solid var(--border-2); border-radius: var(--radius-1);
  background: var(--paper); color: #fff;
  transition: background 120ms, border-color 120ms;
}
.check-box.is-on { background: var(--ocean); border-color: var(--ocean); }
.check-box.is-ya { background: var(--fg-3); border-color: var(--fg-3); }
.check-row.is-checked { background: var(--ocean-20); }
.check-row.is-checked:hover { background: var(--ocean-20); }
.modal-hint-multi {
  font-size: var(--fs-xs); color: var(--fg-3); margin: 0 0 8px;
  padding: 6px 10px; background: var(--cream-100, var(--cream-50));
  border-radius: var(--radius-1);
}
.empty-state { padding: 16px; text-align: center; color: var(--fg-3); font-size: var(--fs-base); }
.modal-footer {
  display: flex; justify-content: flex-end; gap: 8px;
  padding: 14px 22px;
  border-top: 1px solid var(--border-1);
  background: var(--cream-50);
}

code {
  font-family: var(--font-mono);
  background: var(--cream-200);
  padding: 1px 5px; border-radius: var(--radius-1);
  font-size: 0.92em;
}
/* Popup establecimientos */
.estab-popup-btn {
  display: inline-flex; align-items: center; gap: 5px;
  background: transparent; border: 1px solid var(--border-1);
  border-radius: var(--radius-1); padding: 3px 8px;
  font-size: var(--fs-xs); color: var(--fg-3); cursor: pointer;
  font-family: var(--font-body); font-weight: var(--fw-medium);
  transition: border-color 120ms, color 120ms, background 120ms;
}
.estab-popup-btn:hover { border-color: var(--ocean); color: var(--ocean); background: var(--ocean-20); }
.estab-popup-btn.is-primary {
  background: var(--ocean); border-color: var(--ocean); color: #fff; font-weight: var(--fw-medium);
}
.estab-popup-btn.is-primary:hover { opacity: 0.9; background: var(--ocean); color: #fff; }
.estab-popup-btn:disabled { opacity: 0.4; cursor: not-allowed; }
.estab-popup-btn.is-primary:disabled:hover { opacity: 0.4; }
.estab-popup {
  position: fixed; z-index: 9000;
  background: var(--paper); border: 1px solid var(--border-2);
  border-radius: var(--radius-3); box-shadow: var(--shadow-3);
  padding: 16px 20px; min-width: 280px; max-width: 420px; max-height: 400px;
  display: flex; flex-direction: column; gap: 8px;
  animation: lift 160ms cubic-bezier(.2,.7,.2,1);
}
.estab-popup-header {
  display: flex; align-items: center; justify-content: space-between;
  padding-bottom: 8px; border-bottom: 1px solid var(--border-1);
}
.estab-popup-title {
  font-family: var(--font-display); font-weight: var(--fw-heavy); font-size: var(--fs-base);
  color: var(--plum); letter-spacing: var(--tracking-overline);
}
.estab-popup-list {
  overflow-y: auto; flex: 1;
  display: flex; flex-direction: column; gap: 2px;
}
.estab-popup-item {
  display: flex; align-items: baseline; gap: 8px;
  font-size: var(--fs-sm); padding: 3px 0;
  border-bottom: 1px solid var(--cream-200);
}
.estab-popup-rbd { font-family: var(--font-mono); font-size: var(--fs-overline); color: var(--fg-3); min-width: 40px; }
.estab-popup-nom { color: var(--fg-1); font-weight: var(--fw-medium); }
.estab-popup-com { font-size: var(--fs-overline); color: var(--fg-3); margin-left: auto; }

/* Filtro GSE */
.gse-filter {
  display: inline-flex; align-items: center; gap: 6px;
  font-size: var(--fs-sm); color: var(--fg-3);
}
.gse-filter-label { font-weight: var(--fw-medium); font-size: var(--fs-xs); letter-spacing: 0.06em; }
.gse-filter select {
  font-family: var(--font-body); font-size: var(--fs-sm); font-weight: var(--fw-medium);
  color: var(--fg-1); background: var(--paper);
  border: 1px solid var(--border-2); border-radius: var(--radius-1);
  padding: 4px 22px 4px 8px; cursor: pointer; appearance: none;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23747474' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><polyline points='6 9 12 15 18 9'/></svg>");
  background-repeat: no-repeat; background-position: right 5px center; background-size: 12px;
}

/* ============================================================
   Vista de Categoría de Desempeño (grilla de 4 columnas)
   ============================================================ */
.app-main { flex: 1; padding: 0 40px 24px; width: 100%; }

/* Barra de resumen del territorio seleccionado */
.terr-summary {
  display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap;
  padding: 18px 0 14px;
}
.terr-summary-name {
  font-family: var(--font-display); font-weight: var(--fw-heavy);
  font-size: var(--fs-h1); letter-spacing: -0.01em; color: var(--plum);
}
.terr-summary-meta { font-size: var(--fs-base); color: var(--fg-3); }
.terr-summary-meta strong { color: var(--fg-1); font-weight: var(--fw-bold); }
.terr-narrativa {
  margin: 22px 0 0;
}
.terr-narrativa-name {
  margin: 0 0 14px;
  font-family: var(--font-display); font-weight: var(--fw-heavy);
  font-size: var(--fs-h1); letter-spacing: -0.01em; color: var(--plum);
  line-height: 1.1;
}
.terr-narrativa-p {
  margin: 0 0 10px;
  font-size: 14px;
  line-height: 2.0;
  color: var(--fg-1);
}
.terr-narrativa-p:last-child { margin-bottom: 0; }
.dato-destacado {
  display: inline-block;
  background: var(--cream-50);
  border: 1px solid var(--border-1);
  border-radius: var(--radius-2);
  padding: 0 6px;
  line-height: 1.45;
  vertical-align: baseline;
  font-weight: var(--fw-bold);
  color: var(--plum);
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}
.terr-pill {
  display: inline-flex; align-items: center; gap: 5px;
  font-size: var(--fs-xs); font-weight: var(--fw-medium); color: var(--fg-3);
  background: var(--cream-50); border: 1px solid var(--border-1);
  border-radius: var(--radius-full); padding: 3px 10px;
}

/* Grilla de 4 columnas */
.cat-grid {
  display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px;
  align-items: start; margin-top: 20px;
}
@media (max-width: 980px) { .cat-grid { grid-template-columns: repeat(2, 1fr); } }
@media (max-width: 560px) { .cat-grid { grid-template-columns: 1fr; } }

.cat-col {
  background: var(--bg-2); border: 1px solid var(--border-1);
  border-radius: var(--radius-3); overflow: hidden;
  display: flex; flex-direction: column;
}
.cat-col-head {
  padding: 12px 14px; color: #fff;
  display: flex; flex-direction: column; gap: 3px;
}
.cat-col-title {
  font-family: var(--font-display); font-weight: var(--fw-heavy); font-size: var(--fs-lg);
  letter-spacing: 0.01em;
}
.cat-col-stat { font-size: var(--fs-sm); font-weight: var(--fw-medium); opacity: 0.92; }
.cat-col-stat strong { font-weight: var(--fw-heavy); }
.cat-col-mat { font-size: var(--fs-sm); font-weight: var(--fw-medium); opacity: 0.82; }
.cat-col-mat strong { font-weight: var(--fw-heavy); }
.cat-col-bar {
  height: 4px; width: 100%; background: rgba(255,255,255,0.28);
}
.cat-col-bar-fill { height: 100%; background: rgba(255,255,255,0.9); }
.cat-col-list {
  list-style: none; margin: 0; padding: 8px;
  display: flex; flex-direction: column; gap: 10px;
  max-height: 620px; overflow-y: auto;
}
.cat-col-empty { padding: 16px 12px; text-align: center; color: var(--fg-3); font-size: var(--fs-sm); }

/* Fila de establecimiento */
.ee-row {
  display: flex; flex-direction: column; align-items: stretch; gap: 0;
  padding: 11px 12px; border-radius: var(--radius-2);
  border: 1px solid var(--border-1); background: var(--paper);
}
.ee-row:hover { border-color: var(--ocean); box-shadow: var(--shadow-1); }
.ee-row-main { width: 100%; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.ee-row-name {
  font-size: var(--fs-sm); font-weight: var(--fw-medium); color: var(--fg-1);
  line-height: 1.3;             /* nombre completo, sin truncar */
}
.ee-row-meta {
  font-size: var(--fs-xs); color: var(--fg-3);
  display: flex; align-items: center; gap: 6px; flex-wrap: wrap;
}
.ee-row-rbd { font-family: var(--font-mono); }
.ee-row-sep { opacity: 0.5; }

/* Trayectoria: año (rótulo) arriba, marca de color abajo; reciente -> antiguo */
.traj {
  display: flex; gap: 8px; flex-shrink: 0; align-items: flex-end;
  justify-content: space-between;
  width: 100%; margin-top: 10px; padding-top: 10px;
  border-top: 1px dashed var(--border-1);
}
.traj-year { display: inline-flex; flex-direction: column; align-items: center; gap: 4px; }
.traj-year-lbl {
  font-family: var(--font-mono); font-size: var(--fs-xs); font-weight: var(--fw-medium);
  color: var(--fg-3); letter-spacing: -0.01em;
}
.traj-year-lbl.is-vigente { color: var(--ocean); font-weight: var(--fw-heavy); }
.traj-mark {
  width: 18px; height: 18px; border-radius: var(--radius-1);
  border: 1px solid rgba(0,0,0,0.08);
}
.traj-mark.is-si {
  background: var(--cream-200);
  border: 1px dashed var(--line-strong);
}
.traj-mark.is-vigente {
  box-shadow: 0 0 0 2px var(--paper), 0 0 0 3.5px var(--ocean);
}

/* Sección sin categoría vigente */
.sin-vigente {
  margin-top: 20px; padding: 18px 20px;
  background: var(--cream-50); border: 1px solid var(--border-1);
  border-radius: var(--radius-3);
}
.sin-vigente-title {
  font-family: var(--font-display); font-weight: var(--fw-heavy); font-size: var(--fs-lg);
  color: var(--plum); margin: 0 0 4px;
}
.sin-vigente-sub { font-size: var(--fs-sm); color: var(--fg-3); margin: 0 0 14px; }
.sin-vigente-motivos { display: flex; gap: 28px; flex-wrap: wrap; }
.sin-vigente-motivo { display: flex; flex-direction: column; gap: 2px; }
.sin-vigente-n {
  font-family: var(--font-display); font-weight: var(--fw-heavy); font-size: var(--fs-h1); color: var(--fg-1);
}
.sin-vigente-lbl { font-size: var(--fs-sm); color: var(--fg-3); }

/* Fila de EE clickeable + detalle de trayectoria en texto */
.ee-row-li { list-style: none; display: flex; flex-direction: column; gap: 8px; }
.ee-row { cursor: pointer; }
.ee-row.is-open { border-color: var(--ocean); box-shadow: var(--shadow-1); }
.ee-detail {
  padding: 10px 12px; margin-left: 2px;
  background: var(--cream-50); border: 1px solid var(--border-1);
  border-radius: var(--radius-2);
}
.ee-detail-title {
  display: block; margin-bottom: 6px;
  font-size: var(--fs-xs); font-weight: var(--fw-bold); color: var(--fg-3);
}
.ee-detail-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
.ee-detail-row { display: flex; flex-direction: column; gap: 6px; font-size: var(--fs-sm); color: var(--fg-1); }
.ee-detail-row.is-vigente .ee-detail-head { font-weight: var(--fw-bold); }
.ee-detail-row + .ee-detail-row { border-top: 1px solid var(--border-1); padding-top: 10px; }
.ee-detail-head { display: flex; align-items: center; gap: 8px; }
.ee-detail-year {
  font-family: var(--font-mono); font-size: var(--fs-xs); color: var(--fg-3); min-width: 92px;
}
.ee-detail-mark {
  width: 12px; height: 12px; border-radius: var(--radius-1);
  border: 1px solid rgba(0,0,0,0.08); flex-shrink: 0;
}
.ee-detail-mark[data-si="1"] { background: var(--cream-200); border: 1px dashed var(--line-strong); }
.ee-detail-cat { flex: 1; }
.ee-detail-matnivel {
  font-weight: var(--fw-regular); color: var(--fg-3);
  margin-top: 2px; font-size: var(--fs-sm);
}
.ee-detail-ense-list { list-style: none; margin: 4px 0 0; padding: 0; display: flex; flex-direction: column; gap: 2px; }
.ee-ense-item {
  display: flex; flex-direction: column;
  font-size: var(--fs-xs); color: var(--fg-2);
  padding: 1px 0;
}
.ee-ense-head { display: flex; justify-content: space-between; gap: 12px; }
.ee-ense-item.has-cat { color: var(--fg-1); font-weight: var(--fw-medium); }
.ee-ense-label { flex: 1; display: flex; align-items: baseline; gap: 4px; }
.ee-ense-mat { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.ee-detail-ense-total {
  display: flex; justify-content: space-between; gap: 12px;
  font-size: var(--fs-xs); color: var(--fg-1); font-weight: var(--fw-bold);
  margin-top: 4px; padding-top: 4px; border-top: 1px solid var(--border-1);
}
.ee-row-matricula { font-variant-numeric: tabular-nums; }

/* Evolución de matrícula del nivel (bloque separado de la trayectoria) */
.ee-detail-evol {
  margin-top: 10px; padding-top: 10px;
  border-top: 1px solid var(--border-1);
}
.ee-detail-evol-title {
  display: block; margin-bottom: 6px;
  font-size: var(--fs-xs); font-weight: var(--fw-bold); color: var(--fg-3);
}
.ee-evol-list {
  list-style: none; margin: 0 0 6px; padding: 0;
  display: flex; flex-wrap: wrap; gap: 14px;
}
.ee-evol-item { display: flex; flex-direction: column; gap: 1px; }
.ee-evol-year { font-family: var(--font-mono); font-size: var(--fs-overline); color: var(--fg-3); }
.ee-evol-val {
  font-family: var(--font-mono); font-size: var(--fs-base); color: var(--fg-1);
  font-weight: var(--fw-medium); font-variant-numeric: tabular-nums;
}
.ee-detail-evol-delta {
  font-size: var(--fs-xs); font-weight: var(--fw-bold); font-variant-numeric: tabular-nums;
  color: var(--fg-2);
}
.ee-detail-evol-delta.is-up { color: var(--ocean); }
.ee-detail-evol-delta.is-down { color: var(--cat-insuf, #EE2D49); }

/* Lista de EE dentro del bloque sin categoría vigente */
.sin-vigente-lista { margin-top: 16px; }
.sin-vigente-lista-head {
  display: block; margin-bottom: 8px;
  font-size: var(--fs-xs); font-weight: var(--fw-bold); color: var(--fg-2);
}
.sin-vigente-ul {
  max-height: none; overflow: visible; padding: 0;
  display: grid; grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 10px;
}
@media (max-width: 980px) { .sin-vigente-ul { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 560px) { .sin-vigente-ul { grid-template-columns: 1fr; } }

/* Selector de entidad (botón principal) */
.entity-select-btn {
  display: inline-flex; align-items: center; gap: 8px;
  background: var(--bg-2); border: 1px solid var(--border-2);
  border-radius: var(--radius-2); padding: 8px 14px;
  font-family: var(--font-body); font-weight: var(--fw-medium); font-size: var(--fs-base);
  color: var(--plum); cursor: pointer;
}
.entity-select-btn:hover { border-color: var(--plum); }

/* Filtros de chips (comuna, dependencia) */
.chip-filter {
  display: block;
  padding: 0;
}
.chip-filter:first-of-type { margin-top: 0; }
.terr-narrativa + .chip-filter { margin-top: 44px; }
.chip-filter + .chip-filter { margin-top: 12px; }
.chip-filter-title {
  display: block; margin-bottom: 8px;
  font-family: var(--font-display); font-weight: var(--fw-bold); font-size: var(--fs-sm);
  letter-spacing: var(--tracking-overline); color: var(--fg-3);
}
.chip-filter-chips { display: flex; flex-wrap: wrap; gap: 6px; }
.filter-chip {
  background: var(--bg-2); border: 1px solid var(--border-2);
  border-radius: var(--radius-full); padding: 4px 12px;
  font-family: var(--font-body); font-size: var(--fs-sm); font-weight: var(--fw-medium);
  color: var(--fg-3); cursor: pointer;
  transition: background 120ms, color 120ms, border-color 120ms;
}
.filter-chip:hover { border-color: var(--ocean); }
.filter-chip.is-on {
  background: var(--ocean); border-color: var(--ocean); color: #fff;
}

/* ============================================================
   Hoja comparativa (segunda hoja: comparación entre territorios)
   ============================================================ */
.cmp-picker {
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  margin: 4px 0 18px;
}
.cmp-picker-label {
  font-family: var(--font-display); font-weight: var(--fw-bold); font-size: var(--fs-xs);
  letter-spacing: var(--tracking-overline); color: var(--fg-3);
 flex-shrink: 0;
}
.cmp-chip {
  display: inline-flex; align-items: center; gap: 8px;
  background: var(--bg-2); border: 1px solid var(--border-1);
  border-radius: var(--radius-full); padding: 5px 6px 5px 13px;
  font-family: var(--font-body); font-size: var(--fs-sm); font-weight: var(--fw-medium);
  color: var(--fg-1);
}
.cmp-chip-kind {
  font-size: var(--fs-overline); font-weight: var(--fw-bold);
  letter-spacing: var(--tracking-overline); color: var(--fg-3);
}
.cmp-chip-x {
  display: inline-flex; align-items: center; justify-content: center;
  width: 18px; height: 18px; border-radius: var(--radius-full);
  border: none; background: var(--bg-3); color: var(--fg-3);
  font-size: var(--fs-base); line-height: 1; cursor: pointer;
  transition: background 120ms, color 120ms;
}
.cmp-chip-x:hover { background: var(--cat-insuf, #EE2D49); color: #fff; }
.cmp-add-btn {
  background: var(--ocean); border: 1px solid var(--ocean);
  border-radius: var(--radius-full); padding: 5px 14px;
  font-family: var(--font-body); font-size: var(--fs-sm); font-weight: var(--fw-medium);
  color: #fff; cursor: pointer; transition: opacity 120ms;
}
.cmp-add-btn:hover { opacity: 0.88; }
.cmp-add-btn:disabled { opacity: 0.4; cursor: not-allowed; }
.cmp-clear-btn {
  background: transparent; border: 1px solid var(--border-2);
  border-radius: var(--radius-full); padding: 5px 14px;
  font-family: var(--font-body); font-size: var(--fs-sm); font-weight: var(--fw-medium);
  color: var(--fg-2); cursor: pointer; transition: opacity 120ms;
}
.cmp-clear-btn:hover { opacity: 0.7; }
.cmp-hint { font-size: var(--fs-base); color: var(--fg-3); }

.cmp-table-wrap {
  overflow-x: auto; margin-top: 8px;
  background: var(--paper);
  border: 1px solid var(--border-2);
  border-radius: var(--radius-3);
  box-shadow: var(--shadow-1);
  padding: 4px 4px 0;
}
.cmp-table {
  border-collapse: collapse; width: 100%; min-width: 480px;
  font-family: var(--font-body);
  background: var(--paper);
}
.cmp-table th, .cmp-table td {
  border-bottom: 1px solid var(--border-1);
  border-right: 1px solid var(--border-1);
  padding: 12px 18px; text-align: center; vertical-align: middle;
  transition: background 90ms;
}
.cmp-table th:last-child, .cmp-table td:last-child { border-right: none; }
.cmp-table thead th {
  border-bottom: 2px solid var(--line-strong);
  font-family: var(--font-display); font-weight: var(--fw-medium); font-size: var(--fs-base);
  color: var(--fg-1); text-align: center;
}
.cmp-table thead th.cmp-corner {
  text-align: right; color: var(--fg-3); font-weight: var(--fw-medium); font-size: var(--fs-sm);
  letter-spacing: var(--tracking-overline);
}
.cmp-th-kind {
  display: block; font-family: var(--font-body); font-weight: var(--fw-medium);
  font-size: var(--fs-xs); letter-spacing: var(--tracking-overline);
  color: var(--fg-3); margin-top: 3px;
}
.cmp-cat-cell {
  text-align: right !important; font-weight: var(--fw-medium); font-size: var(--fs-base); color: var(--fg-2);
  white-space: nowrap;
}
.cmp-cat-dot {
  display: inline-block; width: 11px; height: 11px; border-radius: var(--radius-1);
  margin-left: 8px; vertical-align: -1px; border: 1px solid rgba(0,0,0,0.08);
}
/* Dato principal: el porcentaje, en negro y peso medio */
.cmp-cell-pct {
  font-size: var(--fs-lg); color: var(--ink); font-weight: var(--fw-medium);
  font-variant-numeric: tabular-nums;
}
/* Dato secundario: el n entre paréntesis, en gris oscuro y sin negrita */
.cmp-cell-n {
  font-size: var(--fs-base); color: var(--fg-2); font-weight: var(--fw-regular);
  margin-left: 5px; font-variant-numeric: tabular-nums;
}
.cmp-cell.is-max .cmp-cell-pct { color: var(--ocean); font-weight: var(--fw-bold); }

/* Resalte cruzado (hover): columna y fila activas, en gris.
   Se usa box-shadow inset (no background) para no pisar el heatmap inline. */
.cmp-table td.is-hl-col, .cmp-table th.is-hl-col {
  box-shadow: inset 0 0 0 9999px rgba(60, 54, 44, 0.06);
}
.cmp-table tr.is-hl-row td {
  box-shadow: inset 0 0 0 9999px rgba(60, 54, 44, 0.06);
}
.cmp-table td.is-hl-cross {
  box-shadow: inset 0 0 0 9999px rgba(60, 54, 44, 0.11);
}
/* Bordes de las celdas bajo highlight, en gris un poco más oscuro */
.cmp-table td.is-hl-col, .cmp-table th.is-hl-col,
.cmp-table tr.is-hl-row td, .cmp-table td.is-hl-cross {
  border-color: var(--fg-3);
}

/* Mapa de calor en fila Insuficiente: mayor % = más rojo (más grave) */
.cmp-cell-heat { position: relative; }
.cmp-cell-heat .cmp-cell-n,
.cmp-cell-heat .cmp-cell-pct { position: relative; z-index: 1; }

.cmp-table tbody tr.cmp-row-total td {
  border-top: 2px solid var(--line-strong); border-bottom: none;
  font-weight: var(--fw-medium); color: var(--fg-1); padding-top: 14px;
}
.cmp-table tbody tr.cmp-row-total .cmp-cell-n {
  font-size: var(--fs-lg); color: var(--ink); font-weight: var(--fw-medium); margin-left: 0;
}
.cmp-table tbody tr.cmp-row-sv td {
  border-bottom: none; padding-top: 8px;
  font-size: var(--fs-base); color: var(--fg-3); font-style: italic;
}
.cmp-empty {
  padding: 40px 18px; text-align: center; color: var(--fg-3);
  font-size: var(--fs-lg); background: var(--bg-2);
  border: 1px dashed var(--border-2); border-radius: var(--radius-3);
}

/* Leyenda de trayectoria (destacada) */
.traj-legend {
  display: flex; align-items: center; gap: 18px; flex-wrap: wrap;
  justify-content: space-between;
  margin: 20px 0 0; padding: 14px 18px;
  background: var(--bg-2); border: 1px solid var(--border-1);
  border-radius: var(--radius-3);
}
.traj-legend-head {
  font-family: var(--font-display); font-weight: var(--fw-heavy); font-size: var(--fs-lg);
  color: var(--plum); letter-spacing: -0.005em;
}
.traj-legend-items { display: flex; align-items: center; gap: 26px; flex-wrap: wrap; flex: 0 1 auto; justify-content: flex-end; }
.traj-legend-item {
  display: inline-flex; align-items: center; gap: 7px;
  font-size: var(--fs-base); font-weight: var(--fw-medium); color: var(--fg-2);
}
.traj-legend-sw {
  width: 16px; height: 16px; border-radius: var(--radius-1);
  border: 1px solid rgba(0,0,0,0.08);
}
.traj-legend-sw.is-si {
  background: var(--cream-200); border: 1px dashed var(--line-strong);
}

/* Foco año en tabla */
.data-table.has-year-focus td.td-cell:not(.td-focused-year) { opacity: 0.25; }
.data-table.has-year-focus th.th-year:not(.th-focused-year) { opacity: 0.35; }
.data-table.has-year-focus td.td-ent,
.data-table.has-year-focus td.td-gse { opacity: 1 !important; }

/* Celda vacía GSE: sin recuadro, fondo transparente */
.chart-cell.is-empty {
  background: transparent !important;
  border: none !important;
  box-shadow: none !important;
}

/* Heatmap fijo */
.heat-band-1 { background: rgba(180,30,30,0.18); }
.heat-band-2 { background: rgba(232,134,99,0.22); }
.heat-band-3 { background: rgba(255,201,46,0.18); }
.heat-band-4 { background: transparent; }

/* Entities-bar: selector nueva estructura */
.entity-selector-bar {
  padding: 20px 40px 22px;
  background: var(--bg-3);
  border-bottom: 1px solid var(--border-1);
}
.entity-selector-inner {
  display: flex; align-items: flex-end; gap: 16px; flex-wrap: wrap;
}
.entity-selector-field { display: flex; flex-direction: column; gap: 5px; }
.entity-selector-field .control-label { margin-bottom: 0; }
.entity-selector-divider {
  width: 1px; height: 36px; background: var(--border-1); margin: 0 4px; align-self: flex-end;
}
.entity-selector-actions { margin-left: auto; display: flex; align-items: center; gap: 8px; }
.entities-chips { padding: 12px 40px 0; display: flex; flex-wrap: wrap; gap: 8px; }
.entities-chips-inner {
  background: var(--bg-3);
  border-bottom: 1px solid var(--border-1);
  padding: 0 40px 16px;
}
.entities-chips-head {
  display: flex; align-items: baseline; gap: 12px; padding: 16px 0 10px;
}

/* Estab popup trigger en entidad chip */
.entity-estab-btn {
  display: inline-flex; align-items: center; gap: 4px;
  font-size: var(--fs-xs); color: var(--fg-3); cursor: pointer;
  background: transparent; border: 0; padding: 0;
  font-family: var(--font-body);
}
.entity-estab-btn:hover { color: var(--ocean); text-decoration: underline; }

</style>

<body>
  <div id="root"></div>
  <div id="global-tooltip" class="tooltip" style="display:none"></div>
  <div id="tooltip-overlay" style="display:none;position:fixed;inset:0;z-index:9998;"></div>

  <!-- React + Babel desde CDN — builds production + SRI (auditoría B4, s13).
       Hashes sha384 calculados desde los tarballs oficiales de npm
       (identicos a lo servido por unpkg para la version fijada). Si se
       cambia la version, recalcular: openssl dgst -sha384 -binary | base64 -->
  <script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"
          integrity="sha384-DGyLxAyjq0f9SPpVevD6IgztCFlnMF6oW/XQGmfe+IsZ8TqEiDrcHkMLKI6fiB/Z"
          crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"
          integrity="sha384-gTGxhz21lVGYNMcdJOyq01Edg0jhn/c22nsx0kyqP0TxaV5WVdsSH1fSDUf5YJj1"
          crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js"
          integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y"
          crossorigin="anonymous"></script>

  <!-- D3 inline -->
  <script>__D3_INLINE__</script>

  <!-- pako inline (descompresión gzip del JSON embebido) -->
  <script>__PAKO_INLINE__</script>

  <!-- Datos reales del pipeline R (gzip + base64, descomprimidos en cliente) -->
  <script>
    const DATA = JSON.parse(pako.inflate(
      Uint8Array.from(atob("__JSON_DATA__"), c => c.charCodeAt(0)),
      { to: "string" }
    ));
  </script>

  <!-- Aplicación React (JSX, compilado por Babel en el cliente) -->
  <script type="text/babel" data-presets="env,react">
    "use strict";

    // ============================================================
    // CatData — adaptador de datos de Categoría de Desempeño.
    // Sin ponderación por matrícula, sin GSE: agregación = conteo de EE.
    // ============================================================
    const CatData = (function () {
      const M = DATA.meta;
      const YEARS = M.anios.slice().sort((a, b) => a - b);
      const ANIO_VIGENTE = M.anio_vigente;
      // Anio vigente de matricula (tamano), separado del de categoria. La tarjeta
      // de tamano de la fila de EE usa este; la trayectoria/serie usan ANIO_VIGENTE.
      const ANIO_MAT_VIGENTE = M.anio_matricula_vigente || M.anio_vigente;
      const CATEGORIAS = M.categorias.slice();          // orden semántico Insuf -> Alto
      const CAT_COLORS = M.cat_colors;
      const CAT_LABELS = M.cat_labels;
      const NIVELES = M.niveles;                          // {basica, media}
      const MOTIVOS = M.motivos;
      const DEPE_LABELS = M.depe_labels || {};
      const ENSE2_LABELS = M.ense2_labels || {};
      const ENSE2_A_NIVEL = M.ense2_a_nivel || {};
      const GRADO_LABELS = M.grado_labels || {};   // {cod_ense2: {cod_grado: glosa}}

      // ---- Catálogos territoriales ----
      const COMUNA_BY_COD = new Map(DATA.comunas.map(c => [String(c.cod), c]));

      const REGIONES = (function () {
        const nomReg = {};
        DATA.regiones.forEach(r => { nomReg[String(r.cod)] = r.nom; });
        const byReg = new Map();
        DATA.comunas.forEach(c => {
          const k = String(c.cod_reg);
          if (!byReg.has(k)) byReg.set(k, { cod: k, nom: nomReg[k] || c.nom_reg || ("Región " + k), comunas: [] });
          byReg.get(k).comunas.push({ cod: String(c.cod), nom: c.nom });
        });
        return Array.from(byReg.values())
          .sort((a, b) => parseInt(a.cod) - parseInt(b.cod))
          .map(r => ({ ...r, comunas: r.comunas.sort((a, b) => a.nom.localeCompare(b.nom, "es")) }));
      })();

      const SLEPS = (function () {
        if (!DATA.sleps) return [];
        const by = new Map();
        DATA.sleps.forEach(r => {
          const k = String(r.cod_slep);
          if (!by.has(k)) by.set(k, { cod: k, nom: r.nombre_slep, anio_traspaso: r.anio_traspaso });
        });
        return Array.from(by.values()).sort((a, b) => a.nom.localeCompare(b.nom, "es"));
      })();

      // ---- Índice territorial: (tipo|cod|nivel|anio) -> {categoria: {n_ee, pct}, total} ----
      const T = DATA.territorial;
      const TER_IX = new Map();
      for (let i = 0; i < T.rows; i++) {
        const k = T.tipo_entidad[i] + "|" + T.cod_entidad[i] + "|" + T.nivel[i] + "|" + T.anio[i];
        if (!TER_IX.has(k)) TER_IX.set(k, { cats: {}, total: 0 });
        const o = TER_IX.get(k);
        o.cats[T.categoria[i]] = { n_ee: T.n_ee[i], pct: T.pct[i] };
        o.total = T.n_categorizados[i];   // mismo denominador en todas las filas de la celda
      }

      // Distribución de un territorio en un nivel/año: 4 categorías + total.
      function getDistribucion(tipo, cod, nivel, anio) {
        const k = tipo + "|" + String(cod) + "|" + nivel + "|" + anio;
        const o = TER_IX.get(k);
        const out = { total: o ? o.total : 0, cats: {} };
        CATEGORIAS.forEach(c => {
          const v = o && o.cats[c] ? o.cats[c] : { n_ee: 0, pct: 0 };
          out.cats[c] = v;
        });
        return out;
      }

      // ---- Índice sin_vigente: (tipo|cod|nivel|anio) -> {motivo: n_ee} ----
      const SV = DATA.sin_vigente;
      const SV_IX = new Map();
      for (let i = 0; i < SV.rows; i++) {
        const k = SV.tipo_entidad[i] + "|" + SV.cod_entidad[i] + "|" + SV.nivel[i] + "|" + SV.anio[i];
        if (!SV_IX.has(k)) SV_IX.set(k, {});
        SV_IX.get(k)[SV.motivo[i]] = SV.n_ee[i];
      }
      function getSinVigente(tipo, cod, nivel, anio) {
        const k = tipo + "|" + String(cod) + "|" + nivel + "|" + anio;
        return SV_IX.get(k) || {};
      }

      // ---- Índice por establecimiento: rbd|nivel -> [{anio, categoria}] (trayectoria) ----
      const R = DATA.rbd;
      const RBD_TRAJ = new Map();   // rbd|nivel -> Map(anio -> categoria)
      const RBD_MOTIVO = new Map(); // rbd|nivel -> Map(anio -> motivo) (solo s/i)
      const RBD_META = new Map();   // rbd -> {nom, cod_com, cod_reg, cod_depe2}
      const R_MOT = R.motivo || null;  // presente solo si el generador exporta motivo
      for (let i = 0; i < R.rows; i++) {
        const rbd = R.rbd[i], niv = R.nivel[i];
        const k = rbd + "|" + niv;
        if (!RBD_TRAJ.has(k)) RBD_TRAJ.set(k, new Map());
        RBD_TRAJ.get(k).set(R.anio[i], R.categoria[i]);
        const mot = R_MOT ? R_MOT[i] : null;
        if (mot) {
          if (!RBD_MOTIVO.has(k)) RBD_MOTIVO.set(k, new Map());
          RBD_MOTIVO.get(k).set(R.anio[i], mot);
        }
        if (!RBD_META.has(rbd)) RBD_META.set(rbd, {
          nom: R.nom_rbd[i], cod_com: String(R.cod_com_rbd[i]),
          cod_reg: String(R.cod_reg_rbd[i]), cod_depe2: String(R.cod_depe2[i]),
          nom_com: (COMUNA_BY_COD.get(String(R.cod_com_rbd[i])) || {}).nom || null
        });
      }

      // ---- Índice de matrícula: rbd -> anio -> {ense2: {cod->matricula}, total} ----
      // Grano cod_ense2 (tipo de enseñanza), distinto al de categoría (nivel).
      // ENSE2_A_NIVEL mapea los tipos con categoría (2->básica, 5/7->media); el
      // resto es matrícula de contexto. total_ee = tamaño completo del EE.
      const MAT = DATA.matricula || null;
      const MAT_IX = new Map();   // rbd -> Map(anio -> {porEnse2: Map(cod->mat), total})
      if (MAT) {
        for (let i = 0; i < MAT.rows; i++) {
          const rbd = MAT.rbd[i], anio = MAT.anio[i];
          if (!MAT_IX.has(rbd)) MAT_IX.set(rbd, new Map());
          const porAnio = MAT_IX.get(rbd);
          if (!porAnio.has(anio)) porAnio.set(anio, { porEnse2: new Map(), total: MAT.matricula_total_ee[i] });
          porAnio.get(anio).porEnse2.set(MAT.cod_ense2[i], MAT.matricula[i]);
        }
      }

      // Matrícula de un nivel del motor (básica|media) para un rbd×año.
      // media = suma de cod_ense2 5 y 7; básica = cod_ense2 2. null si no hay dato.
      function matriculaNivel(rbd, nivel, anio) {
        const porAnio = MAT_IX.get(rbd);
        if (!porAnio) return null;
        const reg = porAnio.get(anio);
        if (!reg) return null;
        const e = reg.porEnse2;
        if (nivel === "basica") {
          return e.has("2") ? e.get("2") : null;
        }
        if (nivel === "media") {
          let s = null;
          if (e.has("5")) s = (s || 0) + e.get("5");
          if (e.has("7")) s = (s || 0) + e.get("7");
          return s;
        }
        return null;
      }

      // Matrícula total del EE (todos los tipos de enseñanza) en un año. null si no hay dato.
      function matriculaTotalEE(rbd, anio) {
        const porAnio = MAT_IX.get(rbd);
        if (!porAnio) return null;
        const reg = porAnio.get(anio);
        return reg ? reg.total : null;
      }

      // Desglose completo por tipo de enseñanza de un rbd×año, ordenado por cod_ense2.
      // Cada item: {cod_ense2, label, matricula, nivel} (nivel = básica|media|null).
      function matriculaDesglose(rbd, anio) {
        const porAnio = MAT_IX.get(rbd);
        if (!porAnio) return [];
        const reg = porAnio.get(anio);
        if (!reg) return [];
        const out = [];
        reg.porEnse2.forEach((mat, cod) => {
          out.push({
            cod_ense2: cod,
            label: (ENSE2_LABELS[cod] || ("Tipo " + cod)),
            matricula: mat,
            nivel: ENSE2_A_NIVEL[cod] || null
          });
        });
        return out.sort((a, b) => a.cod_ense2.localeCompare(b.cod_ense2));
      }

      // ---- Índice de matrícula por grado: rbd -> anio -> cod_ense2 -> Map(grado->mat) ----
      // Grano más fino que MAT_IX (añade el grado dentro del tipo de enseñanza).
      // Solo contiene 2/5/7 (filtrado en R). Detalle opcional de la ficha.
      const MATG = DATA.matricula_grado || null;
      const MATG_IX = new Map();   // rbd -> Map(anio -> Map(cod_ense2 -> Map(grado->mat)))
      if (MATG) {
        for (let i = 0; i < MATG.rows; i++) {
          const rbd = MATG.rbd[i], anio = MATG.anio[i], ense = MATG.cod_ense2[i];
          if (!MATG_IX.has(rbd)) MATG_IX.set(rbd, new Map());
          const porAnio = MATG_IX.get(rbd);
          if (!porAnio.has(anio)) porAnio.set(anio, new Map());
          const porEnse = porAnio.get(anio);
          if (!porEnse.has(ense)) porEnse.set(ense, new Map());
          porEnse.get(ense).set(MATG.cod_grado[i], MATG.matricula[i]);
        }
      }

      // Desglose por grado de un rbd×año×cod_ense2, ordenado por grado numérico.
      // Cada item: {cod_grado, label, matricula}. [] si no hay dato (un cod_ense2
      // sin desglose ese año muestra solo su cifra agregada, sin sub-lista).
      function matriculaPorGrado(rbd, cod_ense2, anio) {
        const porAnio = MATG_IX.get(rbd);
        if (!porAnio) return [];
        const porEnse = porAnio.get(anio);
        if (!porEnse) return [];
        const g = porEnse.get(cod_ense2);
        if (!g) return [];
        const labels = GRADO_LABELS[cod_ense2] || {};
        const out = [];
        g.forEach((mat, grado) => {
          out.push({
            cod_grado: grado,
            label: (labels[grado] || ("Grado " + grado)),
            matricula: mat
          });
        });
        return out.sort((a, b) => (+a.cod_grado) - (+b.cod_grado));
      }

      // Serie de matrícula del nivel (básica|media) a lo largo de todos los años
      // disponibles, ascendente. Cada item: {anio, mat} (mat puede ser null si el EE
      // no tiene ese nivel ese año). Insumo para la evolución de tamaño en la ficha.
      function matriculaSerieNivel(rbd, nivel) {
        return YEARS.map(y => ({ anio: y, mat: matriculaNivel(rbd, nivel, y) }));
      }

      // RBDs que pertenecen a un territorio (para listar EE de la grilla).
      function rbdsDeEntidad(entity) {
        const set = new Set();
        if (entity.kind === "establecimiento") {
          set.add(String(entity.cod));
        } else if (entity.kind === "region") {
          RBD_META.forEach((m, rbd) => { if (m.cod_reg === String(entity.cod)) set.add(rbd); });
        } else if (entity.kind === "comuna") {
          RBD_META.forEach((m, rbd) => { if (m.cod_com === String(entity.cod)) set.add(rbd); });
        } else if (entity.kind === "slep") {
          (entity.rbds || []).forEach(r => set.add(String(r)));
        }
        return set;
      }

      // Catálogo de establecimientos para el buscador (los que tienen alguna medición).
      const ESTAB_CAT = (function () {
        const out = [];
        RBD_META.forEach((m, rbd) => {
          out.push({ rbd, nom: m.nom || ("RBD " + rbd), nom_com: m.nom_com, cod_depe2: m.cod_depe2 });
        });
        return out.sort((a, b) => a.nom.localeCompare(b.nom, "es"));
      })();

      // Lista de EE de una entidad en un nivel, con categoría vigente y trayectoria.
      // Solo EE que tienen alguna medición en ese nivel.
      function getEstablecimientos(entity, nivel) {
        const rbds = rbdsDeEntidad(entity);
        const out = [];
        rbds.forEach(rbd => {
          const traj = RBD_TRAJ.get(rbd + "|" + nivel);
          if (!traj) return;   // este EE no rinde este nivel
          const mtraj = RBD_MOTIVO.get(rbd + "|" + nivel) || null;
          const m = RBD_META.get(rbd);
          const serie = YEARS.map(y => ({
            anio: y,
            categoria: traj.has(y) ? traj.get(y) : null,
            motivo: (mtraj && mtraj.has(y)) ? mtraj.get(y) : null
          }));
          const vigente = traj.has(ANIO_VIGENTE) ? traj.get(ANIO_VIGENTE) : null;
          out.push({
            rbd, nom: m.nom || ("RBD " + rbd), nom_com: m.nom_com, cod_com: m.cod_com,
            cod_depe2: m.cod_depe2, vigente, serie, nivel,
            mat_nivel_vig: matriculaNivel(rbd, nivel, ANIO_MAT_VIGENTE),
            mat_total_vig: matriculaTotalEE(rbd, ANIO_MAT_VIGENTE)
          });
        });
        return out.sort((a, b) => a.nom.localeCompare(b.nom, "es"));
      }

      // Distribución calculada desde una lista de EE ya filtrada (n_ee por categoría).
      // Útil para entidad = establecimiento y para reflejar filtros activos.
      function distribucionDesdeEE(listaEE) {
        const cats = {};
        CATEGORIAS.forEach(c => { cats[c] = { n_ee: 0, pct: 0 }; });
        let total = 0, matTotalNivel = 0;
        // matTotalNivel: matrícula del nivel mostrado sumada SOLO sobre los EE
        // categorizados (mismo universo que 'total'/pct de EE). Denominador para el
        // % de matrícula por categoría; coherente con el % de establecimientos.
        listaEE.forEach(ee => {
          if (ee.vigente && cats[ee.vigente]) {
            cats[ee.vigente].n_ee += 1;
            total += 1;
            matTotalNivel += (ee.mat_nivel_vig || 0);
          }
        });
        CATEGORIAS.forEach(c => { cats[c].pct = total > 0 ? cats[c].n_ee / total : 0; });
        return { total, cats, matTotalNivel };
      }

      return {
        YEARS, ANIO_VIGENTE, ANIO_MAT_VIGENTE, CATEGORIAS, CAT_COLORS, CAT_LABELS, NIVELES, MOTIVOS, DEPE_LABELS,
        ENSE2_LABELS, ENSE2_A_NIVEL,
        REGIONES, SLEPS, COMUNA_BY_COD, ESTAB_CAT,
        getDistribucion, getSinVigente, getEstablecimientos, distribucionDesdeEE,
        matriculaNivel, matriculaTotalEE, matriculaDesglose, matriculaSerieNivel, matriculaPorGrado,
      };
    })();

    // ============================================================
    // Utilidades de formato chileno
    // ============================================================
    function fmtPct1(v) {
      if (v == null) return "—";
      return (v * 100).toFixed(1).replace(".", ",") + "%";
    }
    function fmtInt(v) {
      if (v == null) return "—";
      return v.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ".");
    }

    // ============================================================
    // Narrativa territorial — arma el párrafo de resumen por composición.
    // Devuelve frases como arrays de fragmentos JSX (datos dinámicos en
    // <strong>). Maneja casos borde: categorías con 0 EE se omiten; el sujeto
    // cambia según el tipo de entidad. La matrícula contrasta desempeño "Medio
    // o Alto" vs "Insuficiente" (Medio-Bajo se omite del párrafo de matrícula);
    // anclada a la matrícula vigente (2025), la categoría sigue siendo 2019.
    // Los porcentajes de matrícula se calculan sobre el total del nivel, así que
    // al omitir Medio-Bajo los dos tramos no suman 100% (queda implícito).
    // ============================================================
    function narrativaTerritorial(entity, nivel, dist, porCat) {
      const nivelLbl = (CatData.NIVELES[nivel] || nivel);
      const anioCat = CatData.ANIO_VIGENTE;       // 2019
      const anioMat = CatData.ANIO_MAT_VIGENTE;   // 2025
      const total = dist.total;
      let kk = 0;
      const b = (txt) => <span key={"b" + (kk++)} className="dato-destacado">{txt}</span>;   // dato dinámico

      // Sujeto según tipo de entidad (el nombre va en negrita).
      const sujetoPre = (function () {
        if (entity.kind === "slep") return "El SLEP ";
        if (entity.kind === "comuna") return "La comuna de ";
        if (entity.kind === "region") return "La región de ";
        if (entity.kind === "establecimiento") return "El establecimiento ";
        return "";
      })();

      // Frase 1: cuántos EE categorizados.
      if (total === 0) {
        return {
          frases: [[
            sujetoPre, b(entity.nom), " no tiene establecimientos con " + nivelLbl +
            " categorizados al año ", b(anioCat),
            " para la selección actual."
          ]],
          vacio: true
        };
      }
      const eeLbl = (total === 1) ? "establecimiento" : "establecimientos";
      const frase1 = [
        sujetoPre, b(entity.nom), " tiene ", b(fmtInt(total)), " " + eeLbl + " con " +
        nivelLbl + " " + (total === 1 ? "categorizado" : "categorizados") + " al año ",
        b(anioCat), ", el año más reciente para el cual existe una clasificación."
      ];

      // Frase 2: distribución por categoría, omitiendo las de 0 EE.
      // "Un X% de estos establecimientos está en nivel de desempeño Alto, un Y%
      //  en Medio, ...". Orden de presentación Alto -> Insuficiente.
      const ordenPresenta = ["ALTO", "MEDIO", "MEDIO-BAJO", "INSUFICIENTE"];
      const presentes = ordenPresenta.filter(c => dist.cats[c] && dist.cats[c].n_ee > 0);
      let frase2 = null;
      if (presentes.length === 1) {
        const c = presentes[0];
        frase2 = ["Todos están en nivel de desempeño ", b(CatData.CAT_LABELS[c] || c), "."];
      } else if (presentes.length > 1) {
        const segs = [];
        presentes.forEach((c, i) => {
          const pct = b(fmtPct1(dist.cats[c].pct));
          const lbl = (CatData.CAT_LABELS[c] || c);
          if (i === 0) {
            segs.push("Un ", pct, " de estos establecimientos está en nivel de desempeño " + lbl);
          } else {
            const sep = (i === presentes.length - 1) ? " y un " : ", un ";
            segs.push(sep, pct, " en " + lbl);
          }
        });
        segs.push(".");
        frase2 = segs;
      }

      // Frase 3: matrícula. Contraste Medio+Alto vs Insuficiente (B2). Suma
      // mat_nivel_vig (2025); denominador = matrícula total del nivel
      // categorizado (incluye Medio-Bajo, aunque no se nombre).
      const sumaMat = (cats) => cats.reduce((acc, c) =>
        acc + (porCat[c] || []).reduce((a, e) => a + (e.mat_nivel_vig || 0), 0), 0);
      const matMedioAlto = sumaMat(["ALTO", "MEDIO"]);
      const matInsuf = sumaMat(["INSUFICIENTE"]);
      const matTotalNivel = sumaMat(["ALTO", "MEDIO", "MEDIO-BAJO", "INSUFICIENTE"]);

      let frase3 = null;
      if (matTotalNivel > 0) {
        const segs = ["Considerando la matrícula ", b(anioMat), ", "];
        const tramos = [];
        if (matMedioAlto > 0) {
          tramos.push([
            b(fmtInt(matMedioAlto)), " " +
            (matMedioAlto === 1 ? "estudiante asiste" : "estudiantes asisten") +
            " a un establecimiento de desempeño Medio o Alto (",
            b(fmtPct1(matMedioAlto / matTotalNivel)), " de la matrícula del nivel)"
          ]);
        }
        if (matInsuf > 0) {
          tramos.push([
            b(fmtInt(matInsuf)), " " +
            (matInsuf === 1 ? "asiste" : "asisten") +
            " a uno de desempeño Insuficiente (",
            b(fmtPct1(matInsuf / matTotalNivel)), ")"
          ]);
        }
        tramos.forEach((t, i) => {
          if (i > 0) segs.push(", y ");
          t.forEach(x => segs.push(x));
        });
        segs.push(".");
        frase3 = segs;
      }

      // Frase de cierre (transición a la tabla); formato normal.
      const cierre = ["A continuación se presenta el detalle de los establecimientos y su " +
        "registro histórico de categorizaciones, junto con aquellos sin categoría vigente."];

      return {
        frases: [frase1, frase2, frase3, cierre].filter(Boolean),
        vacio: false
      };
    }

    // ============================================================
    // Header
    // ============================================================
    function Header() {
      return (
        <header className="app-header">
          <div className="app-header-inner">
            <div className="app-header-left">
              <div className="brand-eyebrow-row">
                <span className="brand-eyebrow">SLEP Costa Central</span>
                <span className="brand-divider">·</span>
                <span className="brand-eyebrow brand-eyebrow-muted">Motor de comparación</span>
              </div>
              <h1 className="app-title">
                Categoría de Desempeño
                <span className="app-title-sub"> — distribución de establecimientos</span>
              </h1>
              <p className="app-subtitle">
                Datos 2016–2019 · Sistema de Aseguramiento de la Calidad de la Educación
              </p>
              <p className="app-objective">
                Herramienta de análisis interno del SLEP Costa Central para visualizar
                cómo se distribuyen los establecimientos según su <strong>Categoría de Desempeño</strong>
